<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصنع العضلات - البداية</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .welcome-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; color: #3498db; }
        p { color: #cbd5e1; margin-bottom: 30px; }
        .choice-buttons { display: flex; flex-direction: column; gap: 15px; }
        .btn {
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            color: white;
        }
        .diet-btn { background-color: #27ae60; }
        .workout-btn { background-color: #2980b9; }
        .install-btn { 
            background-color: transparent; 
            border: 2px solid #3498db; 
            color: #3498db;
            margin-top: 20px;
            display: none; /* يظهر فقط عبر جافاسكريبت */
        }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    </style>
</head>
<body>
    <div class="welcome-card">
        <img src="https://i.postimg.cc/mrLC1DL4/Picsart-25-11-15-02-40-50-432.jpg" style="width: 100px; border-radius: 50%; margin-bottom: 20px; border: 3px solid #3498db;">
        <h1>مصنع العضلات</h1>
        <p>مرحباً بك كابتن! اختر النظام الذي تريد إدارته أو قم بتثبيت التطبيق على جهازك للعمل بدون إنترنت.</p>
        
        <div class="choice-buttons">
            <a href="index.html?type=diet" class="btn diet-btn">🍏 إدارة النظام الغذائي</a>
            <a href="index.html?type=workout" class="btn workout-btn">💪 إدارة النظام التدريبي</a>
            <button id="installApp" class="btn install-btn">📲 تثبيت التطبيق على الجهاز</button>
        </div>
    </div>

    <script>
        // تسجيل السيرفس وركر
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // منطق تثبيت التطبيق (PWA)
        let deferredPrompt;
        const installBtn = document.getElementById('installApp');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
